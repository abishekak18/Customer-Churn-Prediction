<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }

        .card{
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.1);
        }

        h1{
            color:#0d6efd;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container mt-5 mb-5">

    <div class="card p-4">

        <h1 class="text-center mb-4">
            Customer Churn Prediction
        </h1>

        <form action="{{ url_for('predict_datapoint') }}" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Gender</label>
                    <select class="form-select" name="gender">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Senior Citizen</label>
                    <select class="form-select" name="SeniorCitizen">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Partner</label>
                    <select class="form-select" name="Partner">
                        <option>No</option>
                        <option>Yes</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Dependents</label>
                    <select class="form-select" name="Dependents">
                        <option>No</option>
                        <option>Yes</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Tenure</label>
                    <input type="number" class="form-control" name="tenure">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Phone Service</label>
                    <select class="form-select" name="PhoneService">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Multiple Lines</label>
                    <select class="form-select" name="MultipleLines">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No phone service</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Internet Service</label>
                    <select class="form-select" name="InternetService">
                        <option>DSL</option>
                        <option>Fiber optic</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Online Security</label>
                    <select class="form-select" name="OnlineSecurity">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Online Backup</label>
                    <select class="form-select" name="OnlineBackup">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Device Protection</label>
                    <select class="form-select" name="DeviceProtection">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Tech Support</label>
                    <select class="form-select" name="TechSupport">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Streaming TV</label>
                    <select class="form-select" name="StreamingTV">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Streaming Movies</label>
                    <select class="form-select" name="StreamingMovies">
                        <option>Yes</option>
                        <option>No</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Contract</label>
                    <select class="form-select" name="Contract">
                        <option>Month-to-month</option>
                        <option>One year</option>
                        <option>Two year</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Paperless Billing</label>
                    <select class="form-select" name="PaperlessBilling">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Payment Method</label>
                    <select class="form-select" name="PaymentMethod">
                        <option>Electronic check</option>
                        <option>Mailed check</option>
                        <option>Bank transfer (automatic)</option>
                        <option>Credit card (automatic)</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Monthly Charges</label>
                    <input type="number" step="0.01" class="form-control" name="MonthlyCharges">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Total Charges</label>
                    <input type="number" step="0.01" class="form-control" name="TotalCharges">
                </div>

            </div>

            <div class="text-center mt-4">

                <button class="btn btn-primary btn-lg">
                    Predict Customer Churn
                </button>

            </div>

        </form>

        {% if prediction %}

        <div class="alert alert-{{color}} mt-5">

            <h3>{{ prediction }}</h3>

            <h5>Confidence : {{ confidence }}%</h5>

        </div>

        {% endif %}

    </div>

</div>

</body>
</html>
